<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- vendor/ is written by `npm run build` at the repo root. -->
    <link rel="stylesheet" href="vendor/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/kino.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
    </div>
    <script>
      // Identical across hero-* compositions except for the aesthetic.
      const aesthetic = Kino.aesthetics.brutalistEditorial;
      Kino.whenReady(aesthetic).then(() => {
        const tl = gsap.timeline({ paused: true });
        Kino.heroReveal(document.getElementById("stage"), tl, {
          aesthetic,
          duration: 5,
          eyebrow: "Copland",
          title: "Stop managing agents.\nStart shipping.",
          subtitle: "Portable agent coordination for real repositories.",
        });
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
