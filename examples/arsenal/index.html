<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kino Arsenal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Renders docs/arsenal.md on load, so the page never drifts from the
     document. Serve the repo root (python3 -m http.server) and open
     /examples/arsenal/. */
  :root { --bg: #0B0C0F; --panel: #13151A; --line: #262A33; --text: #D6D9E0; --muted: #8A90A0; --accent: #F2F4F8; --ice: #BFD4FF; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 "Inter Tight", system-ui, sans-serif; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 16px; }
  header { padding: 52px 0 18px; }
  .kicker { color: var(--muted); font: 500 13px "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
  h1 { font-weight: 800; font-size: clamp(40px, 6vw, 84px); line-height: .95; margin: 10px 0 14px; color: var(--accent); letter-spacing: -.02em; }
  header p { max-width: 860px; margin: 0 0 8px; color: #B9BECA; }
  nav { position: sticky; top: 0; z-index: 3; background: rgba(11,12,15,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
  nav button { font: 500 13px "IBM Plex Mono", monospace; letter-spacing: .06em; background: none; border: 1px solid var(--line); color: var(--muted); padding: 7px 12px; border-radius: 2px; cursor: pointer; }
  nav button.on { color: var(--bg); background: var(--ice); border-color: var(--ice); }
  nav input { margin-left: auto; font: 14px "IBM Plex Mono", monospace; background: var(--panel); color: var(--text); border: 1px solid var(--line); padding: 7px 10px; width: min(320px, 100%); border-radius: 2px; }
  section { padding: 30px 0 10px; }
  section > h2 { font-size: 30px; font-weight: 800; color: var(--accent); margin: 0 0 4px; }
  section > p.intro { color: var(--muted); margin: 0 0 18px; max-width: 900px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
  @media (max-width: 440px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-bottom: 1px solid var(--line); background: #000; cursor: zoom-in; }
  .card .noimg { aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; color: #3a3f4b; font: 500 12px "IBM Plex Mono", monospace; border-bottom: 1px solid var(--line); }
  .card .body { padding: 14px 16px 16px; }
  .card h3 { margin: 0; font-size: 19px; font-weight: 600; color: var(--accent); }
  .card code.api { display: block; margin: 2px 0 10px; font: 12px "IBM Plex Mono", monospace; color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: 62px 1fr; gap: 4px 10px; font-size: 14.5px; }
  dt { font: 500 11px/1.9 "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  dd { margin: 0; }
  dd.avoid { color: #f0b3a8; }
  dd.feels { color: var(--ice); }
  dd.status, dd.kind { color: var(--muted); font-size: 13.5px; }
  /* The shelf is real but narrow; keep it quieter than the core. */
  section[data-s^="Shelf"] .card { opacity: .78; }
  section[data-s^="Shelf"] .card:hover { opacity: 1; }
  .rules { padding: 30px 0 60px; }
  .rules li { margin: 0 0 6px; }
  code { font: 13px "IBM Plex Mono", monospace; color: var(--accent); background: #1B1E25; padding: 1px 5px; border-radius: 2px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; padding: 16px; }
  .lightbox img { max-width: 100%; max-height: 100%; }
  .err { color: #f0b3a8; padding: 40px 0; }
</style>
</head>
<body>
<header class="wrap">
  <div class="kicker">kino · docs/arsenal.md</div>
  <h1>Arsenal</h1>
  <p id="lede">Every technique as a move you can combine.</p>
</header>
<nav><div class="wrap" id="nav"><input id="q" type="search" placeholder="filter: cold, patient, photos, type…"></div></nav>
<main class="wrap" id="main"></main>
<div class="lightbox"><img alt=""></div>
<script>
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // Inline markdown: `code`, **bold**.
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");

  function parse(md) {
    const lines = md.split("\n");
    const doc = {intro: [], sections: []};
    let sec = null, entry = null;
    for (const raw of lines) {
      const l = raw.trimEnd();
      if (l.startsWith("# ")) continue;
      let m;
      if ((m = /^## (.+)$/.exec(l))) { sec = {title: m[1], intro: [], entries: [], bullets: []}; doc.sections.push(sec); entry = null; continue; }
      if ((m = /^\*\*(.+?)\*\*\s*(.*)$/.exec(l))) { entry = {name: m[1], api: m[2].replace(/^\(|\)$/g, ""), fields: []}; sec?.entries.push(entry); continue; }
      if ((m = /^- (\w+): (.*)$/.exec(l)) && entry) { entry.fields.push([m[1], m[2]]); continue; }
      if ((m = /^- (.*)$/.exec(l))) { if (entry) entry.fields.push(["", m[1]]); else (sec ? sec.bullets : doc.intro).push(m[1]); continue; }
      if (l === "") { entry = null; continue; }
      (sec ? sec.intro : doc.intro).push(l);
    }
    return doc;
  }

  function render(doc) {
    const main = document.getElementById("main");
    const nav = document.getElementById("nav");
    document.getElementById("lede").innerHTML = inline(doc.intro[0] || "");
    const all = document.createElement("button");
    all.textContent = "ALL"; all.className = "on"; all.dataset.s = "";
    nav.insertBefore(all, nav.firstChild);
    let after = all;
    for (const sec of doc.sections) {
      const el = document.createElement("section");
      el.dataset.s = sec.title;
      el.innerHTML = `<h2>${inline(sec.title)}</h2>` + (sec.intro.length ? `<p class="intro">${inline(sec.intro.join(" "))}</p>` : "");
      if (sec.entries.length) {
        const b = document.createElement("button");
        b.textContent = sec.title.split(":")[0].toUpperCase(); b.dataset.s = sec.title;
        after.after(b); after = b;
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const e of sec.entries) {
          const card = document.createElement("article");
          card.className = "card";
          const still = e.fields.find(([k]) => k === "still");
          const rows = e.fields.filter(([k]) => k !== "still").map(([k, v]) => `<dt>${esc(k)}</dt><dd class="${esc(k)}">${inline(v)}</dd>`).join("");
          card.innerHTML = (still ? `<img loading="lazy" src="../../${esc(still[1])}" alt="">` : `<div class="noimg">no still yet</div>`) +
            `<div class="body"><h3>${inline(e.name)}</h3>${e.api ? `<code class="api">${esc(e.api.replace(/`/g, ""))}</code>` : ""}<dl>${rows}</dl></div>`;
          card.dataset.text = (e.name + " " + e.api + " " + e.fields.map((f) => f[1]).join(" ")).toLowerCase();
          grid.appendChild(card);
        }
        el.appendChild(grid);
      } else if (sec.bullets.length) {
        el.className = "rules";
        el.insertAdjacentHTML("beforeend", "<ul>" + sec.bullets.map((b) => `<li>${inline(b)}</li>`).join("") + "</ul>");
      }
      main.appendChild(el);
    }
    const apply = () => {
      const on = nav.querySelector("button.on").dataset.s;
      const q = document.getElementById("q").value.trim().toLowerCase();
      document.querySelectorAll("section").forEach((s) => {
        const show = !on || s.dataset.s === on;
        let any = false;
        s.querySelectorAll(".card").forEach((c) => { const v = show && (!q || q.split(/\s+/).every((w) => c.dataset.text.includes(w))); c.style.display = v ? "" : "none"; any ||= v; });
        s.style.display = (show && (any || !s.querySelector(".card"))) && !(q && !any) ? "" : "none";
      });
    };
    nav.querySelectorAll("button").forEach((b) => b.onclick = () => { nav.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); apply(); });
    document.getElementById("q").oninput = apply;
    const lb = document.querySelector(".lightbox");
    document.querySelectorAll(".card img").forEach((i) => i.onclick = () => { lb.querySelector("img").src = i.src; lb.style.display = "flex"; });
    lb.onclick = () => lb.style.display = "none";
  }

  fetch("../../docs/arsenal.md").then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); }).then((md) => render(parse(md)))
    .catch((e) => { document.getElementById("main").innerHTML = `<p class="err">Couldn't load docs/arsenal.md (${esc(String(e))}). Serve the repo root over HTTP and open /examples/arsenal/.</p>`; });
</script>
</body>
</html>
