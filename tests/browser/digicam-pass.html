<!doctype html>
<html><head><meta charset="utf-8"><title>digicamPass</title><script src="../../node_modules/gsap/dist/gsap.min.js"></script><script src="../../dist/kino.js"></script><script src="harness.js"></script></head>
<body><div id="stage" style="position:relative;width:480px;height:270px;display:none"></div><script>
const W = 480, H = 270;
// A test card: a gray ramp on top, saturated patches (R, G, B, skin, sky),
// a pure black field with a bright window (bloom must not sparkle the black
// far from it), and a mid-gray field (noise lives there).
function card(ctx) {
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, "#000"); g.addColorStop(1, "#fff");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 50);
  ["#d01818", "#18b030", "#2040d8", "#c89070", "#88aee0"].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(10 + i * 62, 60, 52, 52); });
  ctx.fillStyle = "#000"; ctx.fillRect(0, 125, 240, 145);
  ctx.fillStyle = "#fff"; ctx.fillRect(190, 150, 30, 30);
  ctx.fillStyle = "#3a3a3a"; ctx.fillRect(250, 125, 230, 145);
}
function digicam(opts, paint = card) {
  const host = document.createElement("div"); document.getElementById("stage").appendChild(host);
  const tl = gsap.timeline({paused: true});
  const out = Kino.digicamPass(host, tl, {width: W, height: H, duration: 2, fps: 24, paint: (ctx) => paint(ctx), ...opts});
  return (t) => { tl.seek(t); const c = canvas(W, H); c.getContext("2d").drawImage(out, 0, 0); return c; };
}
const source = () => { const c = canvas(W, H); const g = c.getContext("2d"); g.fillStyle = "#000"; g.fillRect(0, 0, W, H); card(g); return c; };
const region = (c, x, y, w, h) => c.getContext("2d").getImageData(x, y, w, h).data;
const mean = (d, ch) => { let s = 0; for (let i = ch; i < d.length; i += 4) s += d[i]; return s / (d.length / 4); };
const sd = (d, ch) => { const m = mean(d, ch); let s = 0; for (let i = ch; i < d.length; i += 4) s += (d[i] - m) ** 2; return Math.sqrt(s / (d.length / 4)); };

test("strength 0 is an exact passthrough (no fringe, sharpening, noise or curve)", () => {
  const s = show("source", source());
  const f = show("digicam strength 0", digicam({strength: 0})(1));
  const d = maxDiff(pixels(s), pixels(f));
  assert(d === 0, "max diff " + d);
  return "max channel diff 0";
});
test("defaults: treated, finite, and pure black far from highlights stays exactly black", () => {
  const f = show("digicam defaults", digicam({})(1));
  const s = source();
  assert(maxDiff(pixels(s), pixels(f)) > 30, "looks untreated");
  const black = region(f, 10, 135, 120, 125);
  let m = 0; for (let i = 0; i < black.length; i += 4) m = Math.max(m, black[i], black[i + 1], black[i + 2]);
  assert(m === 0, "black field has max " + m + " (sparkle or lift)");
  return "black field max 0";
});
test("exposure bounds: -3 and +3 stops stay in range and order, +3 clips the ramp early", () => {
  const lo = show("exposure -3", digicam({exposure: -3})(1));
  const hi = show("exposure +3", digicam({exposure: 3})(1));
  const mid = digicam({})(1);
  const ramp = (c) => mean(region(c, 200, 10, 80, 30), 1);
  assert(ramp(lo) < ramp(mid) && ramp(mid) < ramp(hi), `ramp mean ${ramp(lo)} / ${ramp(mid)} / ${ramp(hi)}`);
  const clipAt = (c) => { const d = region(c, 0, 25, W, 1); for (let x = 0; x < W; x++) if (Math.max(d[x * 4], d[x * 4 + 1], d[x * 4 + 2]) >= 250) return x; return W; };
  assert(clipAt(hi) < clipAt(mid), `clip starts at x=${clipAt(hi)} vs ${clipAt(mid)}`);
  return `ramp means ${ramp(lo).toFixed(0)} < ${ramp(mid).toFixed(0)} < ${ramp(hi).toFixed(0)}; +3 clips from x=${clipAt(hi)}`;
});
test("saturated colour stays recognisably that colour", () => {
  const f = show("defaults", digicam({})(1));
  const at = (i) => { const d = region(f, 20 + i * 62, 70, 32, 32); return [mean(d, 0), mean(d, 1), mean(d, 2)]; };
  const [r, g, b] = [at(0), at(1), at(2)];
  assert(r[0] > r[1] + 60 && r[0] > r[2] + 40, "red patch " + r.map(Math.round));
  assert(g[1] > g[0] + 40 && g[1] > g[2] + 20, "green patch " + g.map(Math.round));
  assert(b[2] > b[0] + 60 && b[2] > b[1] + 40, "blue patch " + b.map(Math.round));
  return `R ${r.map(Math.round)}  G ${g.map(Math.round)}  B ${b.map(Math.round)}`;
});
test("noise: bounded, moves per frame, repeats after out-of-order seeks", () => {
  const f = digicam({noise: 0.05});
  const a = f(0.5), b = f(1.0); f(1.7); f(0.1); const c = f(0.5);
  show("t=0.5", a); show("t=1.0", b);
  const gray = (x) => region(x, 270, 140, 190, 110);
  assert(maxDiff(gray(a), gray(b)) > 0, "noise froze");
  assert(maxDiff(pixels(a), pixels(c)) === 0, "t=0.5 not repeatable after other seeks");
  const s = sd(gray(a), 1);
  assert(s > 0.5 && s < 16, "gray field sd " + s.toFixed(2));
  return `gray field sd ${s.toFixed(2)} levels`;
});
test("seed changes noise and fixed pattern only: with both at 0, seeds are identical", () => {
  const a = digicam({noise: 0, pattern: 0, seed: 1})(1), b = digicam({noise: 0, pattern: 0, seed: 99})(1);
  assert(maxDiff(pixels(a), pixels(b)) === 0, "seed leaked into the picture");
  const c = digicam({seed: 1})(1), d = digicam({seed: 99})(1);
  assert(maxDiff(pixels(c), pixels(d)) > 0, "seed had no effect on noise");
});
test("fixed pattern is fixed: same in two frames when per-frame noise is off", () => {
  const f = digicam({noise: 0, pattern: 0.04});
  const a = f(0.2), b = f(1.4);
  assert(maxDiff(pixels(a), pixels(b)) === 0, "fixed pattern changed between frames");
  const s = sd(region(a, 270, 140, 190, 110), 1);
  assert(s > 0.3, "fixed pattern invisible, sd " + s);
  return `gray field sd from pattern alone ${s.toFixed(2)}`;
});
test("contrast across test patterns: checker and colour bars keep their order", () => {
  const checker = (ctx) => { for (let y = 0; y < H; y += 30) for (let x = 0; x < W; x += 30) { ctx.fillStyle = ((x + y) / 30) % 2 ? "#c8c8c8" : "#404040"; ctx.fillRect(x, y, 30, 30); } };
  const f = show("checker", digicam({}, checker)(1));
  const dark = mean(region(f, 5, 5, 20, 20), 1), light = mean(region(f, 35, 5, 20, 20), 1);
  assert(light - dark > 80, `checker contrast ${light.toFixed(0)} - ${dark.toFixed(0)}`);
  const bars = (ctx) => ["#fff", "#ff0", "#0ff", "#0f0", "#f0f", "#f00", "#00f", "#000"].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(i * 60, 0, 60, H); });
  const b = show("colour bars", digicam({}, bars)(1));
  const lum = (i) => { const d = region(b, i * 60 + 20, 100, 20, 60); return 0.2126 * mean(d, 0) + 0.7152 * mean(d, 1) + 0.0722 * mean(d, 2); };
  for (const [hiI, loI] of [[0, 3], [1, 5], [3, 6], [5, 7]]) assert(lum(hiI) > lum(loI), `bar ${hiI} not brighter than ${loI}`);
  return `checker ${dark.toFixed(0)} / ${light.toFixed(0)}`;
});
run();
</script></body></html>
