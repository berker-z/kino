<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="vendor/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/kino.js"></script>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; }
      .stage { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080" data-fps="30">
      <div id="screen" class="stage clip" data-start="0" data-duration="2" data-track-index="0"></div>
      <div id="riso" class="stage clip" data-start="2" data-duration="1" data-track-index="1"></div>
      <div id="dither" class="stage clip" data-start="3" data-duration="1" data-track-index="2"></div>
    </div>
    <script>
      // Smoke test: no audio, no photos, nothing outside this repo. A
      // synthetic test card through each pass, so the toolchain can be
      // checked anywhere and pass parameters can be shown to do something.
      //   0-1 s  screenPass, cyanotype look, grille off
      //   1-2 s  screenPass, cyanotype look, grille on (as the look sets it)
      //   2-3 s  risoPass, the card in one ink and its inverse in the other
      //   3-4 s  ditherPass, Bayer 8, sepia in three tones
      // scripts/smoke.sh snapshots it and checks the grille's effect.
      const W = 1920, H = 1080, FPS = 30;

      function card(ctx, t, invert = false) {
        const g = ctx.createLinearGradient(0, 0, W, 0);
        g.addColorStop(0, invert ? "#fff" : "#000");
        g.addColorStop(1, invert ? "#000" : "#fff");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H * 0.4);
        for (let i = 0; i < 8; i++) {
          const v = Math.round((invert ? 7 - i : i) / 7 * 255);
          ctx.fillStyle = `rgb(${v},${v},${v})`;
          ctx.fillRect((i * W) / 8, H * 0.4, W / 8, H * 0.25);
        }
        ctx.strokeStyle = invert ? "#000" : "#fff";
        ctx.lineWidth = 2;
        for (let x = 0; x <= W; x += 60) { ctx.beginPath(); ctx.moveTo(x + 0.5, H * 0.65); ctx.lineTo(x + 0.5, H); ctx.stroke(); }
        for (let y = H * 0.65; y <= H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke(); }
        ctx.fillStyle = invert ? "#000" : "#fff";
        ctx.font = '800 120px "Inter Tight"';
        ctx.fillText("KINO SMOKE", 80 + t * 40, H * 0.85);
      }

      Kino.whenReady(Kino.cyanotype).then(() => {
        const tl = gsap.timeline({ paused: true });
        Kino.screenPass(document.getElementById("screen"), tl, {
          width: W, height: H, start: 0, duration: 2, fps: FPS,
          paint: (ctx, t) => card(ctx, t),
          ...Kino.cyanotype.texture.screen,
          tune: (t) => (t < 1 ? { grille: 0 } : {}),
        });
        Kino.risoPass(document.getElementById("riso"), tl, {
          width: W, height: H, start: 2, duration: 1, fps: FPS,
          paint: (a, b, t) => { card(a, t); card(b, t, true); },
          ...Kino.riso.texture.riso,
        });
        Kino.ditherPass(document.getElementById("dither"), tl, {
          width: W, height: H, start: 3, duration: 1, fps: FPS, scale: 2,
          method: "bayer-8", palette: "sepia-3", prep: "none",
          paint: (ctx, t) => card(ctx, t),
        });
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
