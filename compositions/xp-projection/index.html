<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1440" />
    <link rel="stylesheet" href="vendor/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/kino.js"></script>
    <script src="scene.js"></script>
    <style>
      html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="2560" data-height="1440" data-fps="24">
      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
    </div>
    <script>
      // SANCTUARY (projection, phase 4). The room and the projector are
      // scene.js (Kino.surfaceProject); the material after it is a light
      // filmPass (soft halation off the lit stone, faint grain, no toning).
      const W = 2560, H = 1440, DURATION = 12, FPS = 24;
      sanctuaryScene().then(({ project }) => {
        const tl = gsap.timeline({ paused: true });
        Kino.filmPass(document.getElementById("stage"), tl, {
          width: W, height: H, duration: DURATION, fps: FPS, paint: (ctx, t) => project(ctx, t),
          grain: 0.03, halation: 0.25, halationColor: "#ffd9b0", halationThreshold: 0.6, contrast: 0.25, vignette: 0.35, weave: 0,
        });
        window.__timelines["main"] = tl;
      }).catch((e) => console.error("scene failed:", e && e.stack || e));
    </script>
  </body>
</html>
