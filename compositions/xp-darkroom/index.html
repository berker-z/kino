<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1440" />
    <link rel="stylesheet" href="vendor/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/kino.js"></script>
    <script src="scene.js"></script>
    <style>
      html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="2560" data-height="1440" data-fps="24">
      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
    </div>
    <script>
      // THE SILENT CITY (darkroom PoC). The picture is scene.js; this file
      // only exposes it on film: filmPass with a faint split tone, and one
      // small lift in exposure as the works give way to the harbour.
      const W = 2560, H = 1440, DURATION = 12, FPS = 24;
      darkroomScene().then((paint) => {
        const tl = gsap.timeline({ paused: true });
        Kino.filmPass(document.getElementById("stage"), tl, {
          width: W, height: H, duration: DURATION, fps: FPS, paint,
          toning: ["#0a0b0e", "#f4ede1"],
          grain: 0.075, halation: 0.55, halationThreshold: 0.7, halationRadius: 26, vignette: 0.3, weave: 0.7,
          tune: (t) => ({ exposure: 0.3 * Math.sin(Math.PI * Kino.progress(t, 7.0, 2.8)) }),
        });
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
