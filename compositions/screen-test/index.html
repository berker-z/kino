<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1440" />
    <!-- assets/ (plates, track, beat map, spectrum) is local only. Plate credits: assets/plates/CREDITS.txt -->
    <link rel="stylesheet" href="vendor/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/kino.js"></script>
    <script src="assets/audiomap.js"></script>
    <script src="assets/spectrum.js"></script>
    <style>
      html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="2560" data-height="1440" data-fps="30">
      <div id="stage" class="clip" data-start="0" data-duration="25" data-track-index="0"></div>
      <audio id="music" src="assets/track.opus" data-start="0" data-duration="25" data-track-index="1" data-timeline-role="music"></audio>
    </div>
    <script>
      // The cyanotype look on our own material: five scenes cut on the bar,
      // each with something moving at constant speed, and physical transitions
      // between them (a sheet sliding in, a torn print, a glass lens). Everything
      // is painted in grayscale; screenPass makes it cyanotype on a Trinitron,
      // type included.
      const W = 2560, H = 1440, DURATION = 25, FPS = 30;
      const A = Kino.cyanotype;
      const map = Kino.beatMap(window.AUDIOMAP);
      const b = (i) => map.beats[i];
      const beat = b(1) - b(0);
      const bar = (n) => b(2 + 4 * n); // downbeats
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const reveal = (t, at, beats = 0.75) => (t - at) / (beat * beats);

      const SCENES = { plotter: [0, bar(1)], strip: [bar(1), bar(3)], dish: [bar(3), bar(5)], network: [bar(5), bar(7)], lockup: [bar(7), DURATION] };
      const names = ["crowd", "dish", "hands", "microphone", "mouth", "switchboard", "tower", "typewriter", "waves"];
      const loaded = names.map((name) => {
        const img = new Image();
        img.src = `assets/plates/${name}.jpg`;
        return img.decode().then(() => [name, img]);
      });

      Promise.all([Kino.whenReady(A), ...loaded]).then(([, ...pairs]) => {
        const plates = Object.fromEntries(pairs.map(([name, img]) => [name, Kino.preparePlate(img, { width: W, height: H })]));
        const elapsed = (t, scene) => t - SCENES[scene][0];

        // 1. Plotter: the song's spectrum feeding up a column on the right,
        // the title wiping in on the left on beats.
        const feed = Kino.spectrumFeed({
          spectrum: window.SPECTRUM, beats: map.beats, duration: DURATION, fps: FPS, width: W, height: H,
          left: 0.56, right: 0.92, bottom: 0.84, rows: 36, pxPerFrame: 2, amplitude: 0.3, lineWidth: 4, fadeOldest: 8,
        });
        function plotter(ctx, t) {
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, W, H);
          feed.paint(ctx, t);
          Kino.wipeText(ctx, "THE FUTURE", { x: 150, y: 640, size: 210, progress: reveal(t, b(2)) });
          Kino.wipeText(ctx, "OF SPEECH", { x: 150, y: 850, size: 210, progress: reveal(t, b(4)) });
          if (t > b(0)) Kino.caption(ctx, "FIG. 01   SPECTRAL HISTORY, ONE LINE PER EIGHTH", 156, 1290);
        }

        // 2. Contact strip: sun-prints of the song's subjects sliding left on
        // paper. A glass lens crosses them.
        const strip = Kino.printStrip({
          prints: ["mouth", "microphone", "switchboard", "typewriter", "tower", "crowd", "hands", "dish"].map((n, i) => Kino.sunprint(plates[n], 860, 600, 11 + i * 3)),
          labels: ["VOICE", "MICROPHONE", "EXCHANGE", "KEYS", "TOWER", "CROWD", "HAND", "RECEIVER"],
          fps: FPS, frameWidth: W,
        });
        function contact(ctx, t) {
          ctx.fillStyle = "#e6e6e6";
          ctx.fillRect(0, 0, W, H);
          strip(ctx, elapsed(t, "strip"));
          Kino.caption(ctx, "FIG. 02   CARRIERS", 156, 150, { ink: "#111" });
          Kino.wipeText(ctx, "SPEECH", { x: 150, y: 1300, size: 190, progress: reveal(t, b(8), 0.6), ink: "#111" });
        }

        // 3. Dish: full bleed, slow push, a side strip of the tower climbing.
        const towerStrip = Kino.sunprint(plates.tower, 620, 1700, 41);
        function dish(ctx, t) {
          const z = 1 + 0.09 * elapsed(t, "dish") / (SCENES.dish[1] - SCENES.dish[0]);
          ctx.save();
          ctx.translate(W * 0.42, H * 0.42);
          ctx.scale(z, z);
          ctx.translate(-W * 0.42, -H * 0.42);
          ctx.drawImage(plates.dish, -260, 0);
          ctx.restore();
          ctx.fillStyle = "#000";
          ctx.fillRect(W - 760, 0, 760, H);
          ctx.drawImage(towerStrip, W - 690, -40 - Math.round(elapsed(t, "dish") * FPS) * 2);
          Kino.wipeText(ctx, "LISTENING", { x: 150, y: 1260, size: 190, progress: reveal(t, bar(4)) });
          Kino.caption(ctx, "FIG. 03   RECEIVER, PARKES-TYPE DISH", 156, 1330);
        }

        // 4. Network: a crowd print drifting up on the left, a node tree
        // growing on the right, one generation per beat.
        const tree = Kino.networkTree({ x: 1820, y: 1300, seed: 3 });
        const crowdPrint = Kino.sunprint(plates.crowd, 980, 1500, 77);
        function network(ctx, t) {
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, W, H);
          ctx.drawImage(crowdPrint, 120, -10 - Math.round(elapsed(t, "network") * FPS));
          tree.paint(ctx, elapsed(t, "network") / beat);
          Kino.caption(ctx, "FIG. 04   A NETWORK, GROWN ONE GENERATION PER BEAT", W - 156, 1330, { align: "right" });
        }

        // 5. Lockup over the waves.
        function lockup(ctx, t) {
          const p = elapsed(t, "lockup") / (DURATION - SCENES.lockup[0]);
          const z = 1.04 + 0.06 * p;
          ctx.save();
          ctx.translate(W / 2, H / 2);
          ctx.scale(z, z);
          ctx.rotate(-0.02 + 0.03 * p);
          ctx.translate(-W / 2, -H / 2);
          ctx.drawImage(plates.waves, 0, 0);
          ctx.restore();
          const ink = Kino.haloInk(ctx, 0, { x: W / 2, y: H / 2 + 20, width: 1500, height: 900 }, 0.6);
          Kino.wipeText(ctx, "THE FUTURE", { x: W / 2, y: 700, size: 230, align: "center", ink, progress: reveal(t, SCENES.lockup[0] + beat) });
          Kino.wipeText(ctx, "OF SPEECH", { x: W / 2, y: 920, size: 230, align: "center", ink, progress: reveal(t, SCENES.lockup[0] + 2 * beat) });
          Kino.caption(ctx, "THE FUTURE OF SPEECH   KINO TEST 02", W / 2, 1330, { align: "center" });
        }

        // ---- edit -------------------------------------------------------------------
        const SLIDE = beat * 0.9;
        const TEAR = beat * 0.9;
        const LENS = beat * 1.4;
        // The lens opens on the root of the network tree, where something is lit.
        const lensAt = { x: 1820, y: 1150 };
        const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

        function paint(ctx, t) {
          if (t < SCENES.strip[0]) return plotter(ctx, t);
          if (t < SCENES.strip[0] + SLIDE) {
            // The paper slides in from the right and pushes the plot off.
            const x = Math.round(W * ease((t - SCENES.strip[0]) / SLIDE));
            ctx.save(); ctx.translate(-x, 0); plotter(ctx, t); ctx.restore();
            ctx.save(); ctx.translate(W - x, 0); contact(ctx, t); ctx.restore();
            return;
          }
          if (t < SCENES.dish[0]) return contact(ctx, t);
          if (t < SCENES.dish[0] + TEAR) return Kino.tornWipe(ctx, contact, dish, t, (t - SCENES.dish[0]) / TEAR, { width: W, height: H, seed: 5 });
          if (t < SCENES.network[0]) return dish(ctx, t);
          if (t < SCENES.network[0] + LENS) return Kino.lensPass(ctx, dish, network, t, (t - SCENES.network[0]) / LENS, lensAt);
          if (t < SCENES.lockup[0]) return network(ctx, t);
          if (t < SCENES.lockup[0] + TEAR) return Kino.tornWipe(ctx, network, lockup, t, (t - SCENES.lockup[0]) / TEAR, { width: W, height: H, seed: 9, direction: -1 });
          return lockup(ctx, t);
        }

        // Lens distortions live in the shader so they bend the picture and not the grille.
        function fx(t) {
          const lp = (t - b(9)) / (beat * 6); // a glass lens drifting across the contact strip
          if (lp > 0 && lp < 1) return { lensX: W * (-0.1 + 1.2 * lp), lensY: H * 0.46, lensR: 330, lensK: 0.55 * Math.sin(Math.PI * lp) };
          if (t >= SCENES.network[0] && t < SCENES.network[0] + LENS) return Kino.lensPassFx((t - SCENES.network[0]) / LENS, lensAt);
          return {};
        }

        const tl = gsap.timeline({ paused: true });
        Kino.screenPass(document.getElementById("stage"), tl, {
          width: W, height: H, duration: DURATION, fps: FPS, paint, tune: fx, ...A.texture.screen,
        });
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
