<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1440" />
    <link rel="stylesheet" href="vendor/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/kino.js"></script>
    <script src="scene.js"></script>
    <style>
      html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="2560" data-height="1440" data-fps="24">
      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
    </div>
    <script>
      // WHITE ORCHARD (false infrared, phase 5). Footage and timing are
      // scene.js; the material is Kino.infraredPass, colour proxies only.
      // Frames: ffmpeg -ss 6 -t 12 -i canopy.webm -vf fps=24 -q:v 3 assets/canopy/c%03d.jpg
      const W = 2560, H = 1440, DURATION = 12, FPS = 24;
      orchardScene().then(({ paint, tune }) => {
        const tl = gsap.timeline({ paused: true });
        Kino.infraredPass(document.getElementById("stage"), tl, { width: W, height: H, duration: DURATION, fps: FPS, paint, tune });
        window.__timelines["main"] = tl;
      }).catch((e) => console.error("scene failed:", e && e.stack || e));
    </script>
  </body>
</html>
