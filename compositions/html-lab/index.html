<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1440" />
    <link rel="stylesheet" href="vendor/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/kino.js"></script>
    <style>
      html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="2560" data-height="1440" data-fps="30">
      <div id="stage" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
    </div>
    <script>
      // Lab for htmlPlate: an editorial page set in HTML and CSS (columns,
      // a table, balanced headline), snapshotted once, then animated part by
      // part in canvas and put through the cyanotype screen.
      const W = 2560, H = 1440, DURATION = 8, FPS = 30;
      const A = Kino.cyanotype;
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

      const css = `
        .pg { position: absolute; inset: 0; padding: 120px 150px; color: #fff; font-family: "Inter Tight"; box-sizing: border-box; }
        .mast { display: flex; justify-content: space-between; font: 500 26px "IBM Plex Mono"; letter-spacing: .14em; text-transform: uppercase; border-bottom: 3px solid #fff; padding-bottom: 18px; }
        .head { font-weight: 800; font-size: 190px; line-height: .9; letter-spacing: -.02em; margin: 70px 0 0; width: 1500px; text-wrap: balance; }
        .deck { font-size: 44px; line-height: 1.3; width: 1300px; margin: 44px 0 0; color: #cfcfcf; }
        .cols { position: absolute; left: 150px; right: 150px; bottom: 120px; display: grid; grid-template-columns: 1fr 1fr 1fr 1.1fr; gap: 70px; font-size: 27px; line-height: 1.5; color: #bdbdbd; }
        .cols p { margin: 0; text-wrap: pretty; }
        table { border-collapse: collapse; width: 100%; font: 400 24px "IBM Plex Mono"; }
        td { border-top: 2px solid #777; padding: 10px 0; }
        td:last-child { text-align: right; color: #fff; }
      `;
      const html = `<div class="pg">
        <div class="mast" data-part="mast"><span>Kino Quarterly</span><span>No. 03 · Signal</span><span>Autumn 2026</span></div>
        <h1 class="head" data-part="head">The future of speech is listening</h1>
        <p class="deck" data-part="deck">Every machine that ever carried a voice had to decide what to throw away. A field guide to the losses, from the carbon microphone to the codec.</p>
        <div class="cols">
          <p data-part="c1">A voice is mostly air. The carbon microphone kept the middle of it, the part between three hundred and three thousand cycles, and the telephone network was built around that band for a century.</p>
          <p data-part="c2">The switchboard added a second loss: whoever was listening. Operators heard everything, and a call was a thing three people took part in, whether two of them knew it or not.</p>
          <p data-part="c3">Radio threw away the wire and kept the band. The dish on the hill hears the whole sky at once and has to be told, patiently, which whisper to keep.</p>
          <table data-part="tbl">
            <tr><td>Carbon microphone</td><td>1878</td></tr>
            <tr><td>Manual switchboard</td><td>1878</td></tr>
            <tr><td>AM broadcast</td><td>1920</td></tr>
            <tr><td>Vocoder</td><td>1939</td></tr>
            <tr><td>Parkes dish</td><td>1961</td></tr>
          </table>
        </div>
      </div>`;

      // Each part rises a little and wipes on left to right, in reading order.
      const ORDER = [["mast", 0.2], ["head", 0.6], ["deck", 1.5], ["c1", 2.3], ["c2", 2.6], ["c3", 2.9], ["tbl", 3.3]];

      Promise.all([Kino.whenReady(A), document.fonts.load('600 27px "Inter Tight"')]).then(() => Kino.htmlPlate({ html, css, width: W, height: H })).then((plate) => {
        function paint(ctx, t) {
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, W, H);
          // A slow push on the whole page, about the centre of the headline.
          const z = 1 + 0.035 * (t / DURATION);
          ctx.save();
          ctx.translate(W * 0.4, H * 0.4); ctx.scale(z, z); ctx.translate(-W * 0.4, -H * 0.4);
          for (const [name, at] of ORDER) {
            const p = plate.parts[name];
            if (!p) continue;
            const k = ease((t - at) / 0.9);
            if (k <= 0) continue;
            const lift = (1 - k) * 40;
            ctx.save();
            ctx.beginPath();
            ctx.rect(p.x - 10, p.y - 20 + lift, (p.w + 20) * clamp((t - at) / 0.7), p.h + 40);
            ctx.clip();
            Kino.drawPart(ctx, plate, name, p.x, p.y + lift);
            ctx.restore();
          }
          ctx.restore();
        }
        const tl = gsap.timeline({ paused: true });
        Kino.screenPass(document.getElementById("stage"), tl, { width: W, height: H, duration: DURATION, fps: FPS, paint, ...A.texture.screen });
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
