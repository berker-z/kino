<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1440" />
    <link rel="stylesheet" href="vendor/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/kino.js"></script>
    <script src="scene.js"></script>
    <style>
      html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="2560" data-height="1440" data-fps="24">
      <div id="stage" class="clip" data-start="0" data-duration="13" data-track-index="0"></div>
    </div>
    <script>
      // ELEVATIONS (darkroom, second piece). The picture is scene.js: four
      // a tower with fog and a stair exposed through its own sky and shadows. Here it goes
      // onto film, with a slightly colder print than THE SILENT CITY.
      const W = 2560, H = 1440, DURATION = 13, FPS = 24;
      elevationsScene().then((paint) => {
        const tl = gsap.timeline({ paused: true });
        Kino.filmPass(document.getElementById("stage"), tl, {
          width: W, height: H, duration: DURATION, fps: FPS, paint,
          toning: ["#090b0f", "#f0ede6"],
          grain: 0.08, halation: 0.5, halationThreshold: 0.74, halationRadius: 24, vignette: 0.26, weave: 0.7,
        });
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
