<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=3840, height=2160" />
    <!-- assets/ holds grayscale plates made from the NousCon reference; local only. -->
    <link rel="stylesheet" href="vendor/fonts.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/kino.js"></script>
    <style>
      html, body { margin: 0; width: 3840px; height: 2160px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="3840" data-height="2160" data-fps="30">
      <div id="stage" class="clip" data-start="0" data-duration="9" data-track-index="0"></div>
    </div>
    <script>
      // Lab for the NousCon screen treatment. Same 4K size as the reference so
      // crops compare 1:1. Each second is one (try, plate) pair:
      // t = try * 3 + plate.
      const W = 3840, H = 2160;
      const plates = ["plate_4_5", "plate_16_2", "plate_27_5"];
      const tries = [
        // A: beaded stripes, soft lens.
        { grille: 0.3, beads: 0.35, softness: 2, fringe: 8, edgeBlur: 8, bloom: 0.2, grain: 0.2 },
        // B: softer still.
        { grille: 0.34, beads: 0.35, softness: 3, fringe: 8, edgeBlur: 8, bloom: 0.2, grain: 0.2 },
        // C: B with stronger beads and fibre.
        { grille: 0.36, beads: 0.6, softness: 2.5, fringe: 8, edgeBlur: 8, bloom: 0.2, grain: 0.35 },
      ];

      const images = plates.map((name) => {
        const img = new Image();
        img.src = `assets/${name}.png`;
        return img;
      });
      const loaded = Promise.all(images.map((img) => img.decode()));

      Promise.all([Kino.whenReady(Kino.signalDither), loaded]).then(() => {
        const tl = gsap.timeline({ paused: true });
        const stage = document.getElementById("stage");
        Kino.screenPass(stage, tl, {
          width: W, height: H, duration: 9, fps: 30,
          paint: (ctx, t) => ctx.drawImage(images[Math.floor(t) % 3], 0, 0, W, H),
          tune: (t) => tries[Math.min(2, Math.floor(t / 3))],
        });
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
