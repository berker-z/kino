<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1440" />
    <link rel="stylesheet" href="../vendor/fonts.css" />
    <script src="../vendor/gsap.min.js"></script>
    <script src="../vendor/kino.js"></script>
    <script src="../scene.js"></script>
    <style>
      html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="2560" data-height="1440" data-fps="30">
      <div id="stage" class="clip" data-start="0" data-duration="9" data-track-index="0"></div>
    </div>
    <script>
      // Cross-material proof for the temporal scan: the same scene.js frames
      // through ditherPass (Bayer 8, ice in three tones). The sampler knows
      // nothing about the material. Levels put the navy ground at the darkest
      // tone, so empty space stays solid instead of patterned.
      //   hyperframes render -c ab/ab.html -o ../../examples/xp-temporal-scan/ab-dither.mp4
      const W = 2560, H = 1440, FPS = 30;
      temporalScene().then((paint) => {
        const tl = gsap.timeline({ paused: true });
        Kino.ditherPass(document.getElementById("stage"), tl, {
          width: W, height: H, duration: 9, fps: FPS, scale: 2,
          method: "bayer-8", palette: "ice-3", prep: { levels: [0.08, 1] }, paint,
        });
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
